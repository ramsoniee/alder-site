<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0E1424}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EDE8DA;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 50% at 50% 0%,#1B2A52 0%,#0E1424 62%)}
.bg svg{position:absolute;top:0;left:0;width:100%;max-width:520px;opacity:.32}
#app{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 96px}
h1{margin:0;font-family:Marcellus,Georgia,serif;font-weight:400;font-size:30px;color:#E6C77A}
h2{margin:20px 0 8px;font-size:13px;font-weight:600;color:#E6C77A;letter-spacing:.05em;text-transform:uppercase}
.sub{font-size:13px;color:#A9B0C3;line-height:1.4;margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input{min-height:48px;width:100%;border-radius:14px;padding:0 14px;font-size:16px;color:#EDE8DA;background:rgba(255,255,255,.08);border:1px solid rgba(201,162,75,.4)}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:none;font-size:15px;font-weight:600;color:#0E1424;background:linear-gradient(180deg,#F0D58F,#C9A24B);white-space:nowrap}
.btn2{min-height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:600;color:#E6C77A;background:transparent;border:1px solid #E6C77A}
.chip{min-height:44px;padding:0 14px;border-radius:22px;font-size:14px;font-weight:500;border:1px solid rgba(201,162,75,.35);background:rgba(255,255,255,.06);color:#D9D3C3}
.chip[aria-pressed=true]{border-color:#E6C77A;background:rgba(230,199,122,.2);color:#F5E3B0}
.card{border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(201,162,75,.28);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:16px;padding:12px 6px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(201,162,75,.28);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:44px}
.tile.no{opacity:.78}
.btn:disabled{opacity:.6}
.tile b{font-size:13px;line-height:1.2;font-weight:600}
.tile small{font-size:11px;color:#A9B0C3}
.em{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Marcellus,Georgia,serif;font-size:22px;color:#0E1424;flex:none}
.em.s{width:44px;height:44px;font-size:18px}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.ok{color:#5ED6B1;background:rgba(94,214,177,.12);border-color:#5ED6B1}
.mid{color:#E3B84A;background:rgba(227,184,74,.12);border-color:#E3B84A}
.low{color:#A9B0C3;background:rgba(169,176,195,.12);border-color:#A9B0C3}
.pur{color:#CDB4F7;background:rgba(177,140,242,.12);border-color:#CDB4F7}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#C9A24B,#F0D58F)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-height:44px}
.slot .em{border:2px dashed rgba(201,162,75,.5);background:transparent;color:#E6C77A}
.slot .em.f{border:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;background:rgba(14,20,36,.96);border-top:1px solid rgba(201,162,75,.3);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:130px;min-height:56px;background:none;border:none;font-size:14px;font-weight:600;color:#A9B0C3}
nav button[aria-current=page]{color:#E6C77A}
.msg{font-size:13px;line-height:1.4;color:#D9D3C3;margin-top:8px}
.note{font-size:12px;line-height:1.4;color:#A9B0C3}
.over{position:fixed;inset:0;background:#0A101F;z-index:5;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.over>div{max-width:520px;margin:0 auto}
a{color:#8FD3E8}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sets span{padding:8px 12px;border-radius:18px;font-size:13px;border:1px solid rgba(205,180,247,.6);background:rgba(177,140,242,.10);color:#E3D6FA}
</style>

erials used."}],"constellations":[{"name":"Prophecy of Submersion","text":"When any of your own party members hits an opponent affected by an Omen, the effects of Hydro-related Elemental Reactions are enhanced for 8s: · Electro-Charged DMG increases by 15%, Lunar-Charged DMG increases by 15%, Vaporize DMG increases by 15%, Hydro…"},{"name":"Lunar Chain","text":"When a Normal Attack hits, there is a 20% chance that it will be automatically followed by a Charged Attack."},{"name":"Restless Revolution","text":"Increases the Level of Stellaris Phantasm by 3."},{"name":"Prophecy of Oblivion","text":"When any party member attacks an opponent affected by an Omen, their CRIT Rate is increased by 15%."},{"name":"Mockery of Fortuna","text":"Increases the Level of Mirror Reflection of Doom by 3."},{"name":"Rhetorics of Calamitas","text":"Upon entering Illusory Torrent, Mona gains a 60% increase to the DMG of her next Charged Attack per second of movement."}]},"10000042":{"title":"Driving Thunder","bio":"The Yuheng of the Liyue Qixing. Keqing has much to say about Rex Lapis's unilateral approach to policymaking in Liyue — but in truth, gods admire skeptics such as her quite a lot.","skill":{"name":"Stellar Restoration","gist":"Hurls a Lightning Stiletto that annihilates her opponents like the swift thunder."},"burst":{"name":"Starward Sword","gist":"Keqing unleashes the power of lightning, dealing Electro DMG in an AOE."},"passives":[{"name":"Thundering Penance","gist":"After recasting Stellar Restoration while a Lightning Stiletto is present, Keqing's weapon gains an Electro Infusion for 5s."},{"name":"Aristocratic Dignity","gist":"When casting Starward Sword, Keqing's CRIT Rate is increased by 15%, and her Energy Recharge is increased by 15%."},{"name":"Land's Overseer","gist":"When dispatched on an expedition in Liyue, time consumed is reduced by 25%."}],"constellations":[{"name":"Thundering Might","text":"Recasting Stellar Restoration while a Lightning Stiletto is present causes Keqing to deal 50% of her ATK as AoE Electro DMG at the start point and terminus of her Blink."},{"name":"Keen Extraction","text":"When Keqing's Normal and Charged Attacks hit opponents affected by Electro, they have a 50% chance of producing an Elemental Particle."},{"name":"Foreseen Reformation","text":"Increases the Level of Starward Sword by 3."},{"name":"Attunement","text":"For 10s after Keqing triggers an Electro-related Elemental Reaction, her ATK is increased by 25%."},{"name":"Beckoning Stars","text":"Increases the Level of Stellar Restoration by 3."},{"name":"Tenacious Star","text":"When initiating a Normal Attack, a Charged Attack, Elemental Skill or Elemental Burst, Keqing gains a 6% Electro DMG Bonus for 8s."}]},"10000043":{"title":"Harmless Sweetie","bio":"An alchemist filled with curiosity about all things. She researches bio-alchemy.","skill":{"name":"Astable Anemohypostasis Creation - 6308","gist":"Creates a small Wind Spirit that pulls opponents and objects towards its location, launches opponents within its AoE, and deals Anemo DMG."},"burst":{"name":"Forbidden Creation - Isomer 75 / Type II","gist":"Sucrose hurls an unstable concoction that creates a Large Wind Spirit."},"passives":[{"name":"Catalyst Conversion","gist":"When Sucrose triggers a Swirl or Stellar Swirl reaction, all characters in the party with the matching element (excluding Sucrose) have their Elemental Mastery increased by 50 for 8s."},{"name":"Mollis Favonius","gist":"When Astable Anemohypostasis Creation - 6308 or Forbidden Creation - Isomer 75 / Type II hits an opponent, increases all party members' (excluding Sucrose) Elemental Mastery by an amount equal to 20% of Sucrose's Elemental Mastery for 8s."},{"name":"Astable Invention","gist":"When Sucrose crafts Character and Weapon Enhancement Materials, she has a 10% chance to obtain double the product."}],"constellations":[{"name":"Clustered Vacuum Field","text":"Astable Anemohypostasis Creation - 6308 gains 1 additional charge."},{"name":"Beth: Unbound Form","text":"The duration of Forbidden Creation - Isomer 75 / Type II is increased by 2s."},{"name":"Flawless Alchemistress","text":"Increases the Level of Astable Anemohypostasis Creation - 6308 by 3."},{"name":"Alchemania","text":"Sucrose will reduce the CD of Astable Anemohypostasis Creation - 6308 by 1-7s for every 7 Normal or Charged Attack hits she scores against opponents."},{"name":"Caution: Standard Flask","text":"Increases the Level of Forbidden Creation - Isomer 75 / Type II by 3."},{"name":"Chaotic Entropy","text":"If Forbidden Creation - Isomer 75 / Type II triggers an Elemental Absorption, all party members gain a 20% Elemental DMG Bonus for the corresponding absorbed element during its duration."}]},"10000044":{"title":"Blazing Riff","bio":"Liyue's sole rock 'n' roll musician. She rebels against ossified prejudices using her music and passionate singing.","skill":{"name":"Sweeping Fervor","gist":"Xinyan brandishes her instrument, dealing Pyro DMG on nearby opponents, forming a shield made out of her audience's passion."},"burst":{"name":"Riff Revolution","gist":"Strumming rapidly, Xinyan launches nearby opponents and deals Physical DMG to them, hyping up the crowd."},"passives":[{"name":"\"The Show Goes On, Even Without an Audience...\"","gist":"Decreases the number of opponents Sweeping Fervor must hit to trigger each level of shielding. ·Shield Level 2: Lead-In requirement reduced to 1 opponent hit. ·Shield Level 3: Rave requirement reduced to 2 opponents hit or more."},{"name":"\"...Now That's Rock 'N' Roll!\"","gist":"Characters shielded by Sweeping Fervor deal 15% increased Physical DMG."},{"name":"A Rad Recipe","gist":"When a Perfect Cooking is achieved on a DEF-boosting dish, Xinyan has a 12% chance to obtain double the product."}],"constellations":[{"name":"Fatal Acceleration","text":"Upon scoring a CRIT Hit, increases ATK SPD of Xinyan's Normal and Charged Attacks by 12% for 5s."},{"name":"Impromptu Opening"," nful Grace","text":"Ravaging Confession's CRIT Hits regenerate 5 Energy for Rosaria."},{"name":"Last Rites","text":"Increases the Level of Rites of Termination by 3."},{"name":"Divine Retribution","text":"Rites of Termination's attack decreases opponents' Physical RES by 20% for 10s."}]},"10000046":{"title":"Fragrance in Thaw","bio":"The 77th Director of the Wangsheng Funeral Parlor. She took over the business at a rather young age.","skill":{"name":"Guide to Afterlife","gist":"Only an unwavering flame can cleanse the impurities of this world."},"burst":{"name":"Spirit Soother","gist":"Commands a blazing spirit to attack, dealing Pyro DMG in a large AoE."},"passives":[{"name":"Flutter By","gist":"When a Paramita Papilio state activated by Guide to Afterlife ends, all allies in the party (excluding Hu Tao herself) will have their CRIT Rate increased by 12% for 8s."},{"name":"Sanguine Rouge","gist":"When Hu Tao's HP is equal to or less than 50%, her Pyro DMG Bonus is increased by 33%."},{"name":"The More the Merrier","gist":"When Hu Tao cooks a dish perfectly, she has an 18% chance to receive an additional \"Suspicious\" dish of the same type."}],"constellations":[{"name":"Crimson Bouquet","text":"While in a Paramita Papilio state activated by Guide to Afterlife, Hu Tao's Charged Attacks do not consume Stamina."},{"name":"Ominous Rainfall","text":"Increases the Blood Blossom DMG by an amount equal to 10% of Hu Tao's Max HP at the time the effect is applied."},{"name":"Lingering Carmine","text":"Increases the Level of Guide to Afterlife by 3."},{"name":"Garden of Eternal Rest","text":"Upon defeating an enemy affected by a Blood Blossom that Hu Tao applied herself, all nearby allies in the party (excluding Hu Tao herself) will have their CRIT Rate increased by 12% for 15s."},{"name":"Floral Incense","text":"Increases the Level of Spirit Soother by 3."},{"name":"Butterfly's Embrace","text":"Triggers when Hu Tao's HP drops below 25%, or when she suffers a lethal strike: Hu Tao will not fall as a result of the DMG sustained."}]},"10000047":{"title":"Scarlet Leaves Pursue Wild Waves","bio":"A wandering samurai from Inazuma who is currently with Liyue's Crux Fleet. A gentle and carefree soul whose heart hides a great many burdens from the past.","skill":{"name":"Chihayaburu","gist":"Unleashes a secret technique as fierce as the rushing wind that pulls objects and opponents towards Kazuha's current position before launching opponents within the AoE, dealing Anemo DMG and lifting Kazuha into the air…"},"burst":{"name":"Kazuha Slash","gist":"The signature technique of Kazuha's self-styled bladework — a single slash that strikes with the force of the first winds of autumn, dealing AoE Anemo DMG."},"passives":[{"name":"Soumon Swordsmanship","gist":"If Chihayaburu comes into contact with Hydro/Pyro/Cryo/Electro when cast, this Chihayaburu will absorb that element and if Plunging Attack: Midare Ranzan is used before the effect expires, it will deal an additional 200% ATK of the…"},{"name":"Poetics of Fuubutsu","gist":"Upon triggering a Swirl or Stellar Swirl reaction, Kaedehara Kazuha will grant all party members a 0.04% Elemental DMG Bonus to the element absorbed by Swirl for every point of Elemental Mastery he has for 8s."},{"name":"Cloud Strider","gist":"Decreases sprinting Stamina consumption for your own party members by 20%."}],"constellations":[{"name":"Scarlet Hills","text":"Decreases Chihayaburu's CD by 10%."},{"name":"Yamaarashi Tailwind","text":"The Autumn Whirlwind field created by Kazuha Slash has the following effects: · Increases Kaedehara Kazuha's own Elemental Mastery by 200 for its duration. · Increases the Elemental Mastery of characters within the field by 200."},{"name":"Maple Monogatari","text":"Increases the Level of Chihayaburu by 3."},{"name":"Oozora Genpou","text":"When Kaedehara Kazuha's Energy is lower than 45, he obtains the following effects: · or Holding Chihayaburu regenerates 3 or 4 Energy for Kaedehara Kazuha, respectively. ·When gliding, Kaedehara Kazuha regenerates 2 Energy per second."},{"name":"Wisdom of Bansei","text":"Increases the Level of Kazuha Slash by 3."},{"name":"Crimson Momiji","text":"After using Chihayaburu or Kazuha Slash, Kaedehara Kazuha gains an Anemo Infusion for 5s."}]},"10000048":{"title":"Wise Innocence","bio":"A well-known legal adviser active in Liyue Harbor. A brilliant young lady in whose veins runs the blood of an illuminated beast.","skill":{"name":"Signed Edict","gist":"Summons blistering flames that deal AoE Pyro DMG."},"burst":{"name":"Done Deal","gist":"Triggers a spray of intense flames that rush at nearby opponents, dealing AoE Pyro DMG, granting Yanfei the maximum number of Scarlet Seals, and applying Brilliance to her."},"passives":[{"name":"Proviso","gist":"When Yanfei consumes Scarlet Seals by using a Charged Attack, each Scarlet Seal will increase Yanfei's Pyro DMG Bonus by 5%."},{"name":"Blazing Eye","gist":"When Yanfei's Charged Attack deals a CRIT Hit to opponents, she will deal an additional instance of AoE Pyro DMG equal to 80% of her ATK."},{"name":"Encyclopedic Expertise","gist":"Displays the location of nearby resources unique to Liyue on the mini-map."}],"constellations":[{"name":"The Law Knows No Kindness","text":"When Yanfei uses her Charged Attack, each existing Scarlet Seal additionally reduces the stamina cost of this Charged Attack by 10% and increases resistance against interruption during its release."},{"name":"Right of Final Interpretation","text":"Increases Yanfei's Charged Attack CRIT Rate by 20% against enemies below 50% HP."},{"name":"Samadhi Fire-Forged","text":"Increases the Level of Signed Edict by 3."},{"name":"Supreme Amnesty","text":"When Done Deal is used: Creates a shield that absorbs up to 45% of Yanfei's Max HP for 15s."},{"name":"Abiding Affidavit","text":"Increases the Level of Done Deal by 3."},{"name":"Extra Clause","text":"Increases the maximum number of Scarlet Seals by 1."}]},"10000049":{"title":"Frolicking Flames","bio":"Owner of Naganohara Fireworks. Known as the \"Queen of the Summer Festival,\" she excels in her craft of creating fireworks that symbolize people's hopes and dreams.","skill":{"name":"Niwabi Fire-Dance","gist":"Yoimiya waves a sparkler and causes a ring of saltpeter to surround her."},"burst":{"name":"Ryuukin Saxifrage","gist":"Yoimiya leaps into the air along with her original creation, the \"Ryuukin Saxifrage,\" and fires forth blazing rockets bursting with surprises that deal AoE Pyro DMG and mark one of the hit opponents with Aurous Blaze."},"passives":[{"name":"Tricks of the Trouble-Maker","gist":"During Niwabi Fire-Dance, shots from Yoimiya's Normal Attack will increase her Pyro DMG Bonus by 2% on hit."},{"name":"Summer Night's Dawn","gist":"Using Ryuukin Saxifrage causes nearby party members (not including Yoimiya) to gain a 10% ATK increase for 15s."},{"name":"Blazing Match","gist":"When Yoimiya crafts Decoration, Ornament, and Landscape-type Furnishings, she has a 100% chance to refund a portion of the materials used."}],"constellations":[{"name":"Agate Ryuukin","text":"The Aurous Blaze created by Ryuukin Saxifrage lasts for an extra 4s."},{"name":"A Procession of Bonfires","text":"When Yoimiya's Pyro DMG scores a CRIT Hit, Yoimiya will gain a 25% Pyro DMG Bonus for 6s."},{"name":"Trickster's Flare","text":"Increases the Level of Niwabi Fire-Dance by 3."},{"name":"Pyrotechnic Professional","text":"When Yoimiya's own Aurous Blaze triggers an explosion, Niwabi Fire-Dance's CD is decreased by 1.2s."},{"name":"A Summer Festival's Eve","text":"Increases the Level of Ryuukin Saxifrage by 3."},{"name":"Naganohara Meteor Swarm","text":"During Niwabi Fire-Dance, Yoimiya's Normal Attacks have a 50% chance of firing an extra Blazing Arrow that deals 60% of its original DMG."}]},"10000050":{"title":"Protector From Afar","bio":"The Kamisato Clan's housekeeper. A well-known \"fixer\" in Inazuma.","skill":{"name":"Blazing Blessing","gist": rk Today!","gist":"The Muji-Muji Daruma created by Yoohoo Art: Mujina Flurry gains the following effects: ·When healing a character, it will also heal characters near that healed character for 20% the amount of HP. ·Increases the AoE of its attack against…"},{"name":"Yoohoo Art: Silencer's Secret","gist":"When Sayu is in the party, your characters will not startle Crystalflies and certain other animals when getting near them."}],"constellations":[{"name":"Multi-Task no Jutsu","text":"The Muji-Muji Daruma created by Yoohoo Art: Mujina Flurry will ignore HP limits and can simultaneously attack nearby opponents and heal characters."},{"name":"Egress Prep","text":"Yoohoo Art: Fuuin Dash gains the following effects: ·DMG of Fuufuu Whirlwind Kick in Mode increased by 3.3%. ·Every 0.5s in the Fuufuu Windwheel state will increase the DMG of this Fuufuu Whirlwind Kick by 3.3%."},{"name":"Eh, the Bunshin Can Handle It","text":"Increases the Level of Yoohoo Art: Mujina Flurry by 3."},{"name":"Skiving: New and Improved","text":"Sayu recovers 1.2 Energy when she triggers a Swirl or Stellar Swirl reaction while on-field."},{"name":"Speed Comes First","text":"Increases the Level of Yoohoo Art: Fuuin Dash by 3."},{"name":"Sleep O'Clock","text":"The Muji-Muji Daruma created by Sayu's Yoohoo Art: Mujina Flurry will now also benefit from her Elemental Mastery."}]},"10000054":{"title":"Pearl of Wisdom","bio":"The Divine Priestess of Watatsumi Island. All of the island's affairs are at this young lady's fingertips.","skill":{"name":"Kurage's Oath","gist":"Summons a \"Bake-Kurage\" created from water that can heal her allies."},"burst":{"name":"Nereid's Ascension","gist":"Summons the might of Watatsumi, dealing Hydro DMG to surrounding opponents, before robing Kokomi in a Ceremonial Garment made from the flowing waters of Sangonomiya."},"passives":[{"name":"Tamakushi Casket","gist":"If Sangonomiya Kokomi's own Bake-Kurage is on the field when she uses Nereid's Ascension, the Bake-Kurage' e ability to spur his teammates on from the recited prayers of the knightly order, regenerating HP for all nearby party members."},"passives":[{"name":"Suppressive Barrage","gist":"Per the following circumstances, the Soulwind state caused by Starfrost Swirl will grant characters the Detector effect, increasing their Physical DMG by 10% when they are on the field. ·If the Flowfrost Arrow hits more than one opponent…"},{"name":"Topographical Mapping","gist":"When an active character affected by both Skyfeather Song's Eagleplume and Starfrost Swirl's Soulwind at once scores a CRIT Hit with their attacks, Soulwind will grant them 1 stack of Detector from the Ascension Talent Suppressive Barrage."},{"name":"Demarcation","gist":"Displays the location of nearby resources unique to Mondstadt on the mini-map."}],"constellations":[{"name":"Factor Confluence","text":"The Soulwind state of Starfrost Swirl can decrease the healing interval between instances caused by Skyfeather Song's Eagleplume state."},{"name":"Companion's Ingress","text":"When Starfrost Swirl's Flowfrost Arrow first hits an opponent, or its Rimestar Flare hits an opponent, 1 Detector stack from the Ascension Talent \"Suppressive Barrage\" will be generated."},{"name":"Reconnaissance Experience","text":"Increases the Level of Skyfeather Song by 3."},{"name":"Sunfrost Encomium","text":"When Mika's own Skyfeather Song's Eagleplume state heals party members, this will restore 3 Energy to Mika."},{"name":"Signal Arrow","text":"Increases the Level of Starfrost Swirl by 3."},{"name":"Companion's Counsel","text":"The maximum number of Detector stacks that Starfrost Swirl's Soulwind can gain is increased by 1."}]},"10000081":{"title":"Empyrean Reflection","bio":"A renowned architect from Sumeru who perhaps cares a bit too much about too many things. He is an aesthete troubled by reality.","skill":{"name":"Artistic Ingenuity","gist":"Uses Mehrak's mapping ability for offensive purposes, initiating a radial scan that d nd executes an Enigma Thrust, dealing Anemo DMG."},"burst":{"name":"Magic Trick: Astonishing Shift","gist":"Lynette raises her mantle high, dealing AoE Anemo DMG, using skillful sleight of hand to make a giant Bogglecat Box appear!"},"passives":[{"name":"Sophisticated Synergy","gist":"Within 10s after using Magic Trick: Astonishing Shift, when there are 1/2/3/4 Elemental Types in the party, all party members' ATK will be increased by 8%/12%/16%/20% respectively."},{"name":"Props Positively Prepped","gist":"After the Bogglecat Box summoned by Magic Trick: Astonishing Shift performs Elemental Conversion, Lynette's Elemental Burst will deal 15% more DMG."},{"name":"Loci-Based Mnemonics","gist":"Shows the location of nearby Recovery Orbs on the minimap."}],"constellations":[{"name":"A Cold Blade Like a Shadow","text":"When Enigmatic Feint's Enigma Thrust hits an opponent with Shadowsign, a vortex will be created at that opponent's position that will pull nearby opponents in."},{"name":"Endless Mysteries","text":"Whenever the Bogglecat Box summoned by Magic Trick: Astonishing Shift fires a Vivid Shot, it will fire an extra Vivid Shot."},{"name":"Cognition-Inverting Gaze","text":"Increases the Level of Magic Trick: Astonishing Shift by 3."},{"name":"Tacit Coordination","text":"Increases Enigmatic Feint's charges by 1."},{"name":"Obscuring Ambiguity","text":"Increases the Level of Enigmatic Feint by 3."},{"name":"Watchful Eye","text":"When Lynette uses Enigmatic Feint's Enigma Thrust, she will gain an Anemo Infusion and 20% Anemo DMG Bonus for 6s."}]},"10000084":{"title":"Spectacle of Phantasmagoria","bio":"A famed Fontainian magician who possesses great stage presence as well as gift of the gab. Audiences are enthralled by his exquisite skills, and they hang on to his every clever word.","skill":{"name":"Bewildering Lights","gist":"Lyney does a flourish with his hat, unleashing a firework surprise!"},"burst":{"name":"Wondrous Trick: Miracle Parade","gist":"Unleashing his ice","gist":"When Wriothesley's HP is less than 60%, he will obtain a Gracious Rebuke."},{"name":"There Shall Be a Reckoning for Sin","gist":"When Wriothesley's current HP increases or decreases, if he is in the Chilling Penalty state conferred by Icefang Rush, Chilling Penalty will gain one stack of Prosecution Edict."},{"name":"The Duke's Grace","gist":"When Wriothesley crafts Weapon Ascension Materials, he has a 10% chance to receive double the product."}],"constellations":[{"name":"Terror for the Evildoers","text":"The Gracious Rebuke from the Ascension Talent \"There Shall Be a Plea for Justice\" is changed to this: When Wriothesley's HP is less than 60% or while he is in the Chilling Penalty state caused by Icefang Rush, when the fifth attack of Repelling Fists hits…"},{"name":"Shackles for the Arrogant","text":"When using Darkgold Wolfbite, each Prosecution Edict stack from the Ascension Talent \"There Shall Be a Reckoning for Sin\" will increase said ability's DMG dealt by 40%."},{"name":"Punishment for the Frauds","text":"Increases the Level of Normal Attack: Forceful Fists of Frost by 3."},{"name":"Redemption for the Suffering","text":"The HP restored to Wriothesley through Rebuke: Vaulting Fist will be increased to 50% of his Max HP."},{"name":"Mercy for the Wronged","text":"Increases the Level of Darkgold Wolfbite by 3."},{"name":"Esteem for the Innocent","text":"The CRIT Rate of Rebuke: Vaulting Fist will be increased by 10%, and its CRIT DMG by 80%."}]},"10000087":{"title":"Ordainer of Inexorable Judgment","bio":"The Chief Justice of Fontaine, known as the Iudex, is renowned for his unassailable impartiality.","skill":{"name":"O Tears, I Shall Repay","gist":"Summons a Raging Waterfall that will deal AoE Hydro DMG to opponents in front of Neuvillette based on his Max HP."},"burst":{"name":"O Tides, I Have Returned","gist":"Unleashes waves that will deal AoE Hydro DMG based on Neuvillette's Max HP."},"passives":[{"name":"Heir to the Ancient Sea's Authori  Attention\" for 10s."}]},"10000090":{"title":"Executor of Justice","bio":"The captain of the Special Security and Surveillance Patrol, who wears justice as an ever-present seal upon her heart. Her musket shall only ever point at the guilty.","skill":{"name":"Short-Range Rapid Interdiction Fire","gist":"Chevreuse quickly shoulders her musket and fires at her opponent(s), dealing AoE Pyro DMG."},"burst":{"name":"Ring of Bursting Grenades","gist":"Chevreuse fires an explosive grenade at opponents with her musket, dealing AoE Pyro DMG."},"passives":[{"name":"Vanguard's Coordinated Tactics","gist":"When all party members are Pyro and Electro characters and there is at least one Pyro and one Electro character each in the party: Chevreuse grants \"Coordinated Tactics\" to nearby party members: After a character triggers the Overloaded…"},{"name":"Vertical Force Coordination","gist":"After Chevreuse fires an Overcharged Ball using Short-Range Rapid Interdiction Fire, nearby Pyro and Electro characters in the party gain 1% increased ATK for every 1,000 Max HP Chevreuse has for 30s."},{"name":"Double Time March","gist":"Decreases sprinting Stamina consumption for your own party members by 20%."}],"constellations":[{"name":"Stable Front Line's Resolve","text":"When the active character with the \"Coordinated Tactics\" status (not including Chevreuse herself) triggers the Overloaded reaction, they will recover 6 Energy."},{"name":"Sniper Induced Explosion","text":"After Holding Short-Range Rapid Interdiction Fire and hitting a target, 2 chain explosions will be triggered near the location where said target is hit."},{"name":"Practiced Field Stripping Technique","text":"Increases the Level of Short-Range Rapid Interdiction Fire by 3."},{"name":"The Secret to Rapid-Fire Multishots","text":"After using Ring of Bursting Grenades, the Hold mode of Short-Range Rapid Interdiction Fire will not go on cooldown when Chevreuse uses it."},{"name":"Enhanced Incendiary Firepower","text":"In Can the Most Merciful of Spirits Defeat Its Foes?\"","text":"When using Rebound Hydrotherapy and Super Saturated Syringing, Sigewinne can create a Bubbly Shield worth 30% of her Max HP that absorbs Hydro DMG with 250% efficiency."},{"name":"\"Can the Healthiest of Spirits Cure Fevers?\"","text":"Increases the Level of Rebound Hydrotherapy by 3."},{"name":"\"Can the Loveliest of Spirits Keep Decay at Bay?\"","text":"The duration of Super Saturated Syringing is extended by 3s."},{"name":"\"Can the Most Joyful of Spirits Alleviate Agony?\"","text":"Increases the Level of Super Saturated Syringing by 3."},{"name":"\"Can the Most Radiant of Spirits Pray For Me?\"","text":"When Sigewinne performs healing, she will increase the CRIT Rate and CRIT DMG of her Super Saturated Syringing based on her Max HP."}]},"10000096":{"title":"Dire Balemoon","bio":"\"The Knave,\" Fourth of the Fatui Harbingers. A poised, ruthless diplomat. To the children in the House of the Hearth, she is their feared yet dependable \"Father.\"","skill":{"name":"All Is Ash","gist":"Summons forth Balemoon Bloodfire, dealing Pyro DMG to multiple nearby opponents and performing a dash-cleave against one of them, dealing AoE Pyro DMG."},"burst":{"name":"Balemoon Rising","gist":"Arlecchino's great wing of Balemoon Bloodfire beats as she absorbs and clears Blood-Debt Directives around her."},"passives":[{"name":"Agony Alone May Be Repaid","gist":"Blood-Debt Directives have the following characteristics: ·Arlecchino will be granted a Bond of Life worth 130% of her Max HP when an opponent to which she herself applied a Directive is defeated. ·5s after a Directive is applied, it will…"},{"name":"Strength Alone Can Defend","gist":"Arlecchino gains 1% All Elemental and Physical RES for every 100 ATK she has in excess of 1,000."},{"name":"The Balemoon Alone May Know","gist":"While in combat, Arlecchino gains a 40% Pyro DMG Bonus and can only be healed through Balemoon Rising."}],"constellations":[{"name":"\"All Reprisals and Arrears, Mine to Bear...\"","text":"Masque of the Red Death is further enhanced, the value of the increase is 100%."},{"name":"\"All Rewards and Retribution, Mine to Bestow...\"","text":"Blood-Debt Directives are now already Blood-Debt Due when first applied."},{"name":"\"You Shall Become a New Member of Our Family...\"","text":"Increases the Level of Normal Attack: Invitation to a Beheading by 3."},{"name":"\"You Shall Love and Protect Each Other Henceforth...\"","text":"When Arlecchino successfully absorbs a Blood-Debt Directive, Balemoon Rising's CD will decrease by 2s and 15 Elemental Energy will be restored to her."},{"name":"\"For Alone, We Are as Good as Dead...\"","text":"Increases the Level of Balemoon Rising by 3."},{"name":"\"From This Day On, We Shall Delight in New Life Together.\"","text":"The DMG of Balemoon Rising is increased by Arlecchino's ATK multiplied by 700% of Arlecchino's current Bond of Life percentage."}]},"10000097":{"title":"Wisdom's Measure","bio":"The Temple of Silence's heir. Burdened with secrets, he comes from the sands.","skill":{"name":"Ancient Rite: The Thundering Sands","gist":"Gathers the might of thunder, dealing AoE Electro DMG and quickly retreating."},"burst":{"name":"Secret Rite: Twilight Shadowpiercer","gist":"Perform a secret rite, entering the \"Twilight Meditation\" state, during which Sethos's Normal Attacks will be converted into enemy-piercing Dusk Bolts: Deal Electro DMG to opponents in its path, with DMG increased…"},"passives":[{"name":"Black Kite's Enigma","gist":"When Aiming, the charging time is decreased by 0.285s based on each point of Sethos's current Elemental Energy."},{"name":"The Sand King's Boon","gist":"Sethos gains the \"Scorching Sandshade\" effect, increasing the DMG dealt by Shadowpiercing Shots by 700% of Sethos's Elemental Mastery."},{"name":"Thoth's Revelation","gist":"Displays the location of nearby resources unique to Sumeru on the mini-map."}],"constellations":[{"name":"Sealed Shrine's Spiritsong","text":"The CRIT Rate of Shadowpiercing Shot is increased by 15%."},{"name":"Papyrus Scripture of Silent Secrets","text":"When any of the following conditions are met, Sethos gains a 15% Electro DMG Bonus for 10s that may stack twice, with each stack duration counted independently: · Consuming Elemental Energy through Aimed Shots."},{"name":"Ode to the Moonrise Sage","text":"Increases the Level of Normal Attack: Royal Reed Archery by 3."},{"name":"Beneficent Plumage","text":"When a Shadowpiercing Shot or Dusk Bolt strikes 2 or more opponents, all nearby party members gain 80 Elemental Mastery for 10s."},{"name":"Record of the Desolate God's Burning Sands","text":"Increases the Level of Secret Rite: Twilight Shadowpiercer by 3."},{"name":"Pylon of the Sojourning Sun Temple","text":"After Shadowpiercing Shot strikes an opponent, the Elemental Energy consumed by the Ascension Talent \"Black Kite's Enigma\" will be returned."}]},"10000098":{"title":"Candlebearer, Shadowhunter","bio":"An undefeated Champion Duelist. Sword in hand, she defends justice in the Court of Fontaine.","skill":{"name":"Hunter's Vigil","gist":"Preparing her pistolet, she enters the \"Night Vigil\" state, using steel and shot together."},"burst":{"name":"Last Lightfall","gist":"Grants herself a Bond of Life based upon her own max HP before swiftly evading and striking with saber and sidearm as one, dealing AoE Electro DMG."},"passives":[{"name":"Dark-Shattering Flame","gist":"After a nearby party member triggers an Electro-related reaction against an opponent, Electro DMG dealt by Clorinde's Normal Attacks and Last Lightfall will be increased by 20% of Clorinde's ATK for 15s."},{"name":"Lawful Remuneration","gist":"If Clorinde's Bond of Life is equal to or greater than 100% of her Max HP, her CRIT Rate will increase by 10% for 15s whenever her Bond of Life value increases or decreases."},{"name":"Night Vigil's Harvest","gist":"Displays the location of nearby resources unique to Fontaine on the mini-map."}],"constellations":[{"name":"\"From This Day, I Pass the Candle's Shadow-Veil\"","text":"While Hunter's Vigil's Night Vigil state is active, when Electro DMG from Clorinde's Normal Attacks hit opponents, they will trigger 2 coordinated attacks from a Nightvigil Shade summoned near the hit opponent, each dealing 30% of Clorinde's ATK as Electro…"},{"name":"\"Now, As We Face the Perils of the Long Night\"","text":"Enhance the Ascension Talent \"Dark-Shattering Flame\": After a nearby party member triggers an Electro-related reaction against an opponent, Electro DMG dealt by Clorinde's Normal Attacks and Last Lightfall will be increased by 30% of Clorinde's ATK for 15s."},{"name":"\"I Pledge to Remember the Oath of Daylight\"","text":"Increases the Level of Hunter's Vigil by 3."},{"name":"\"To Enshrine Tears, Life, and Love\"","text":"When Last Lightfall deals DMG to opponent(s), DMG dealt is increased based on Clorinde's Bond of Life percentage."},{"name":"\"Holding Dawn's Coming as My Votive\"","text":"Increases the Level of Last Lightfall by 3."},{"name":"\"And So Shall I Never Despair\"","text":"For 12s after Hunter's Vigil is used, Clorinde's CRIT Rate will be increased by 10%, and her CRIT DMG by 70%."}]},"10000099":{"title":"A Thousand Scents Traced","bio":"A Fontainian perfumer, one who bottles secrets.","skill":{"name":"Fragrance Extraction","gist":"Creates a Lumidouce Case that deals AoE Dendro DMG."},"burst":{"name":"Aromatic Explication","gist":"Guiding the fragrances collected within the Case, Emilie converts them into pure Dendro energy, creating a Level 3 Lumidouce Case and stowing existing Cases away."},"passives":[{"name":"Lingering Fragrance","gist":"Each time it collects 2 Scents, the Level 2 Lumidouce Case will consume Scents and release Cleardew Cologne that deals AoE Dendro DMG equal to 600% of Emilie's ATK to opponents."},{"name":"Rectification","gist":"Emilie deals increased DMG to Burning opponents based on her ATK, with er Solo Dance Double."},"passives":[{"name":"Spring Rite of the Chosen One","gist":"When Odette summons her Solo Dance Double, she also obtains 4 stacks of Marvelous Splendor."},{"name":"Pathetique of Pateticheskaya","gist":"For every 100 ATK Odette has over 1,000, her Stellar Glimmer DMG is additionally increased by 1.5% of the original DMG."},{"name":"Stellar Jubilee: Dance of Aurore","gist":"Odette will enter the Radiance: Stellar-Conduct state when she is inside a Polestar Field, or the Radiance: Stellar Swirl state for 8s after a nearby party member triggers a Stellar Swirl reaction."},{"name":"Echo of Winter Daydreams","gist":"Shows the locations of Snezhnaya's Local Specialties on the mini-map, and this effect also applies in the Shadow Realm."}],"constellations":[{"name":"\"On This Danceless Morn, She Gazes at Her Reflection\"","text":"After unleashing the special Elemental Skill Adagio: Coda at Dawn's Tolling, at the dance duet's end Odette will deal an additional instance of Cryo AoE DMG to nearby opponents that is considered: Radiance: Stellar-Conduct or when not in a Radiance state…"},{"name":"\"I Must See the Snow Swan's Unseen Dream for Myself, She Thought\"","text":"The Ascension Talent \"Spring Rite of the Chosen One\" is enhanced as follows: every stack of Marvelous Splendor active also increases the character's ATK by 7%."},{"name":"\"I'll Chase the Shouting Wind Along, Climbing Alone As I Go\"","text":"Increases the Level of Adagio: Phantom Night Dancers by 3."},{"name":"\"Up, Up the Long, Delirious, Burning Blue\"","text":"The Elemental Burst Presto: Bluebird Finale is enhanced as follows: when Odette obtains Snow Swan's Dream, Stellar Glimmer reaction DMG dealt by other nearby party members is increased by 50% of Snow Swan Dream's effects."},{"name":"\"Oh! I Have Slipped the Surly Bonds of Earth\"","text":"Increases the Level of Presto: Bluebird Finale by 3."},{"name":"\"Put Out My Hand, and Touched the Face of the Divine\"","text":"The Ascension Talent \"Spring Rite of the Chosen One\" is enhanced as follows: When Odette grants Marvelous Splendor to all nearby party members, her own Marvelous Splendor stacks will no longer decrease."}]},"10000005:Fire":{"title":null,"bio":"A traveler from another world who had their only kin taken away, forcing them to embark on a journey to find The Seven.","skill":{"name":"Flowfire Blade","gist":"Wields a searing flame that can incinerate the very earth."},"burst":{"name":"Plains Scorcher","gist":"Condense the flames into a mark, dealing Nightsoul-aligned AoE Pyro DMG to opponents up ahead."},"passives":[{"name":"True Flame of Incineration","gist":"When the Traveler has over 20 Nightsoul points, the attack AoE of the Blazing and Scorching Thresholds from the Elemental Skill Flowfire Blade after they hit opponents is increased."},{"name":"Embers Unspent","gist":"After the current active character inside a Blazing Threshold or Scorching Threshold triggers a Pyro-related reaction, the Traveler will regain 5 Energy."}],"constellations":[{"name":"Starfire's Flowing Light","text":"While Blazing Threshold or Scorching Threshold are active, the current active character deals 6% increased DMG."},{"name":"Ever-Lit Candle","text":"Within 12s of using the Elemental Skill Flowfire Blade, after nearby party members trigger a Pyro-related reaction on an opponent, the Traveler will regain 14 Nightsoul points."},{"name":"Relayed Beacon","text":"Increases the Level of Flowfire Blade by 3."},{"name":"Ravaging Flame","text":"After using the Elemental Burst Plains Scorcher, the Traveler gains 20% Pyro DMG Bonus for 9s."},{"name":"The Fire Inextinguishable","text":"Increases the Level of Plains Scorcher by 3."},{"name":"The Sacred Flame Imperishable","text":"While in the Nightsoul's Blessing state, the Traveler's Normal, Charged, and Plunging Attacks will be converted to Nightsoul-aligned Pyro DMG that cannot be overridden, and the CRIT DMG of these attacks is increased by 40%."}]},"10000005:Water":{"title":null,"bio":"A traveler from another world who had their only kin taken away, forcing them to embark on a journey to find The Seven.","skill":{"name":"Aquacrest Saber","gist":"Unleashes a torrent that can cleanse the world."},"burst":{"name":"Rising Waters","gist":"Unleashes a slow-moving floating bubble that deals continuous Hydro DMG to nearby opponents."},"passives":[{"name":"Spotless Waters","gist":"After the Dewdrop fired by the Hold Mode of the Aquacrest Saber hits an opponent, a Sourcewater Droplet will be generated near to the Traveler."},{"name":"Clear Waters","gist":"If HP has been consumed via Suffusion while using the Hold Mode Aquacrest Saber, the Torrent Surge at the skill's end will deal Bonus DMG equal to 45% of the total HP the Traveler has consumed in this skill use via Suffusion."}],"constellations":[{"name":"Swelling Lake","text":"Picking up a Sourcewater Droplet will restore 2 Energy to the Traveler."},{"name":"Trickling Purity","text":"The Movement SPD of Rising Waters' bubble will be decreased by 30%, and its duration increased by 3s."},{"name":"Turbulent Ripples","text":"Increases the Level of Aquacrest Saber by 3."},{"name":"Pouring Descent","text":"When using Aquacrest Saber, an Aquacrest Aegis that can absorb 10% of the Traveler's Max HP in DMG will be created and will absorb Hydro DMG with 250% effectiveness."},{"name":"Churning Whirlpool","text":"Increases the Level of Rising Waters by 3."},{"name":"Tides of Justice","text":"When the Traveler picks up a Sourcewater Droplet, they will restore HP to a nearby party member with the lowest remaining HP percentage based on 6% of said member's Max HP."}]},"10000005:Wind":{"title":null,"bio":"A traveler from another world who had their only kin taken away, forcing them to embark on a journey to find The Seven.","skill":{"name":"Palm Vortex","gist":"Grasping the wind's might, you form a vortex of vacuum in your palm, causing continuous Anemo DMG to opponents in front of you."},"bu ала сила. Расставшись с учителем, она вернулась в Тейват. Известно, что она обучала Тарталью.","source":{"title":"Skirk/Profile, Genshin Impact Wiki (Fandom)","url":"https://genshin-impact.fandom.com/wiki/Skirk/Profile","retrievedAt":"2026-11-03","license":"CC BY-SA"},"status":"Написано вручную","textEn":"Rumors about Skirk outnumber the facts: for years she has wandered Teyvat like a shadow, rarely letting anyone close. As a child she was the lone survivor of a scorched world. A wanderer known as The Foul found her and took her in as a disciple, training her relentlessly until pain no longer registered and strength became her only goal. After parting ways with her teacher she returned to Teyvat. She is known to have trained Tartaglia."}},"meta":{"asOf":"2026-11-03","statuses":["Подтверждено","Анонс","Слух","Оценка"],"currentVersion":{"version":"7.1","status":"Оценка","note":"На 3 ноября в игре идёт версия 7.1 (вторая фаза: Скирк и Эскофье), по сторонним источникам. Перепроверить по официальным новостям при следующем обновлении.","noteEn":"As of 3 November the game is on version 7.1 (second phase: Skirk and Escoffier), per third-party sources. Re-check against official news at the next update."},"versions":[{"version":"7.2","name":"Hour of Ruin","release":"2026-11-04","maintenanceStart":"2026-11-04T06:00:00+08:00","status":"Подтверждено","source":{"sourceId":"genshin-official","url":"https://genshin.hoyoverse.com/m/en/news/detail/167131","title":"Version 7.2 Update Maintenance Preview","published":"2026-11-02"},"newCharacters":[{"name":"Митя","stars":5,"element":"Электро","status":"Подтверждено"},{"name":"Валерий","stars":4,"element":"Электро","status":"Подтверждено"}],"phases":[{"phase":1,"start":"2026-11-04","end":"2026-11-24","status":"Подтверждено","source":{"sourceId":"genshin-official","url":"https://genshin.hoyoverse.com/m/en/news/detail/167139","title":"Version 7.2 Event Wishes Notice - Phase I","published":"2026-11-02"},"characterBanners":[{"character":"Мит function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j){ S.owned=j.owned||{}; S.levels=j.levels||{}; S.builds=j.builds||{}; S.team=j.team||S.team; S.uid=j.uid||''; if(j.lang==='ru'||j.lang==='en') S.lang=j.lang; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({owned:S.owned,levels:S.levels,builds:S.builds,team:S.team,uid:S.uid,lang:S.lang})); }catch(e){} }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const elName = c => (EL[c.element]||{})[S.lang] || '';
const nm = c => c.isTraveler ? t('traveler') : (S.lang==='en' ? c.nameEn : c.nameRu);
const gen = c => c.gender==='м' ? t('male') : t('female');
const byKey = {}; DATA.characters.forEach(c=>byKey[c.key]=c);
function sortChars(){
  const loc = S.lang==='en'?'en':'ru';
  DATA.characters.sort((a,b)=> (b.stars-a.stars) || nm(a).localeCompare(nm(b),loc) || elName(a).localeCompare(elName(b),loc) || String(a.gender).localeCompare(String(b.gender),loc));
}
const sub = c => c.isTraveler ? `${elName(c)} · ${gen(c)}` : `${elName(c)} · ${c.stars}★`;
const emblem = (c,cls='') => `<div class="em ${cls}" style="background:radial-gradient(circle at 30% 25%,#fff 0%,${EL[c.element]?EL[c.element].c:'#aaa'} 70%);box-shadow:0 0 16px ${EL[c.element]?EL[c.element].c:'#aaa'}55">${esc(nm(c).charAt(0))}</div>`;
const FILTERS = ['all','Ice','Water','Electric','Fire','Grass','Wind','Rock'];
const chips = (cur, action) => FILTERS.map(f=>`<button class="chip" data-a="${action}" data-v="${f}" aria-pressed="${cur===f}">${f==='all'?t('all'):EL[f][S.lang]}</button>`).join('');
const matchEl = (c,f) => f==='all' || c.element===f;
const matchQ = (c,q) => !q || (c.nameRu||'').toLowerCase().includes(q) || (c.nameEn||'').toLowerCase().includes(q);
const ownedCount = () => DATA.characters.filter(c=>S.owned[c.key]).length;
const infoOf = c => { const x=(DATA.info||{})[S.lang]||(DATA.info||{}).ru||{}; return x[c.key]; };
const setName = {}; (DATA.sets||[]).forEach(x=>setName[x.id]=x);
const sName = id => setName[id] ? (S.lang==='en'?setName[id].nameEn:setName[id].nameRu) : null;
const weaponById = {}; (DATA.weapons||[]).forEach(x=>weaponById[x.id]=x);
const wName = w => S.lang==='en'?w.nameEn:w.nameRu;
const fmtNum = n => S.lang==='en' ? String(n) : String(n).replace('.',',');
const fmtStat = (p,v) => (PROP[S.lang][p]||p)+' '+(FLAT.indexOf(p)>=0?Math.round(v):fmtNum(Math.round(v*10)/10))+(FLAT.indexOf(p)>=0?'':'%');
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return S.lang==='en' ? `${Number(d)} ${MONTHS_EN[Number(m)-1]} ${y}` : `${d}.${m}.${y}`; };
const nameByRu = n => { const c=DATA.characters.find(x=>!x.isTraveler&&x.nameRu===n); return c?nm(c):n; };
const tr = (map,key) => { const x=map[key]; if(x==null) return key; return typeof x==='string' ? (S.lang==='en'?x:key) : (x[S.lang]||key); };
const langBar = () => `<div class="row" style="justify-content:flex-end;gap:6px;margin-bottom:6px"><button class="chip" style="min-height:36px;padding:0 12px" data-a="lang" data-v="ru" aria-pressed="${S.lang==='ru'}">RU</button><button class="chip" style="min-height:36px;padding:0 12px" data-a="lang" data-v="en" aria-pressed="${S.lang==='en'}">EN</button></div>`;

// ---------- Сборка из витрины ----------
function parseBuild(a){
  const eq = a.equipList||[];
  const wp = eq.find(e=>e.weapon);
  const arts = eq.filter(e=>e.reliquary&&e.flat).map(e=>{
    const f=e.flat;
    return { slot:f.equipType, level:Math.max(0,(e.reliquary.level||1)-1), stars:f.rankLevel||5,
      setId:(DATA.artifactItems||{})[Math.floor(e.itemId/10)]||null,
      main: f.reliquaryMainstat?{p:f.reliquaryMainstat.mainPropId,v:f.reliquaryMainstat.statValue}:null,
      subs:(f.reliquarySubstats||[]).map(x=>({p:x.appendPropId,v:x.statValue})) };
  });
  const aff = wp&&wp.weapon&&wp.weapon.affixMap ? Object.keys(wp.weapon.affixMap).map(k=>wp.weapon.affixMap[k]) : [0];
  return { level:Number((a.propMap&&a.propMap['4001']&&a.propMap['4001'].val)||a.level||1),
    con:(a.talentIdList||[]).length,
    weapon: wp?{id:wp.itemId, level:wp.weapon.level, refine:(aff[0]||0)+1, stars:(wp.flat&&wp.flat.rankLevel)||null}:null,
    arts, talents:Object.keys(a.skillLevelMap||{}).sort().map(k=>a.skillLevelMap[k]) };
}
const critValue = art => art.subs.reduce((s,x)=> s + (x.p==='FIGHT_PROP_CRITICAL'?2*x.v:x.p==='FIGHT_PROP_CRITICAL_HURT'?x.v:0), 0);
function setCounts(arts){ const m={}; arts.forEach(a=>{ if(a.setId) m[a.setId]=(m[a.setId]||0)+1; }); return m; }
function evaluate(b){
  const n = b.arts.length, cv = b.arts.reduce((s,a)=>s+critValue(a),0);
  const counts = Object.values(setCounts(b.arts)).sort((x,y)=>y-x);
  const full = counts[0]>=4, two = counts.filter(c=>c>=2).length>=2, one = counts[0]>=2;
  const avg = n?Math.round(b.arts.reduce((s,a)=>s+a.level,0)/n):0;
  const parts = [
    { name:t('p_level'), note:t('of90',{a:b.level}), k: Math.min(b.level/90,1), w:20 },
    { name:t('p_weapon'), note: b.weapon?t('wlvl',{a:b.weapon.level,r:b.weapon.refine}):t('no_weapon'), k: b.weapon?Math.min(b.weapon.level/90,1):0, w:15 },
    { name:t('p_arts'), note:S.lang==='en'?`${n} of 5`:`${n} из 5`, k:n/5, w:15 },
    { name:t('p_upg'), note: n?t('avg_up',{a:avg}):t('none'), k: n?b.arts.reduce((s,a)=>s+a.level,0)/n/20:0, w:15 },
    { name:t('p_sets'), note: full?t('set4'):two?t('set22'):one?t('set2'):t('set0'), k: full?1:two?0.75:one?0.4:0, w:15 },
    { name:t('p_cv'), note:t('cv_note',{a:fmtNum(Math.round(cv*10)/10)}), k: Math.min(cv/200,1), w:20 },
  ];
  const score = Math.round(parts.reduce((s,p)=>s+p.k*p.w,0));
  return { parts, score, cv };
}
function buildBlock(c){
  const b = S.builds[c.key]; if(!b) return '';
  const ev = evaluate(b);
  const w = b.weapon ? (weaponById[b.weapon.id]||null) : null;
  const wn = b.weapon ? (w?wName(w):t('unknown_weapon',{id:b.weapon.id})) : null;
  const counts = setCounts(b.arts);
  const sets = Object.keys(counts).map(id=>t('pcs_set',{n:counts[id],s:esc(sName(id)||t('unknown_set'))})).join('<br>') || t('no_sets');
  const arts = SLOT_ORDER.map(sl=>{ const a=b.arts.find(x=>x.slot===sl);
    return `<div style="margin-top:8px;font-size:13px;line-height:1.4"><b>${t('slot_'+sl)}</b> ${a?`+${a.level}, ${esc(sName(a.setId)||'?')}<br><span class="note">${a.main?esc(fmtStat(a.main.p,a.main.v)):''}. ${t('substats')}: ${a.subs.map(x=>esc(fmtStat(x.p,x.v))).join('; ')||t('none')}. ${t('cv_art')} ${fmtNum(Math.round(critValue(a)*10)/10)}</span>`:`<span class="note">${t('not_worn')}</span>`}</div>`; }).join('');
  const bars = ev.parts.map(p=>`<div style="margin-top:8px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(p.name)}</span><span class="note">${esc(p.note)}</span></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:${Math.round(p.k*100)}%"></i></div></div>`).join('');
  const tl = b.talents.length?`${t('t_attack')} ${b.talents[0]||'-'} · ${t('t_skill')} ${b.talents[1]||'-'} · ${t('t_burst')} ${b.talents[2]||'-'}`:t('no_data');
  return `<h2>${t('your_build')}</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b style="font-size:15px">${t('readiness')}</b><span style="font-family:Marcellus,Georgia,serif;font-size:26px;color:#E6C77A">${ev.score}%</span></div>
    <div class="bar" style="margin:8px 0"><i style="width:${ev.score}%"></i></div>
    ${bars}
    <div class="note" style="margin-top:10px">${t('build_note')}</div>
  </div>
  <div class="card"><b>${t('equipped')}</b>
    <div style="margin-top:8px;font-size:13px;line-height:1.5"><b>${t('con')}:</b> C${b.con}<br><b>${t('talents')}:</b> ${tl}<br><b>${t('weapon')}:</b> ${wn?esc(wn)+`, ${t('lvl')} ${b.weapon.level}, R${b.weapon.refine}`:t('none')}<br><b>${t('sets')}:</b><br>${sets}</div>
    ${arts}
  </div>`;
}
function constBlock(c){
  const i=infoOf(c); if(!i||!i.constellations||!i.constellations.length) return '';
  const b=S.builds[c.key]; const con=b?b.con:null;
  return `<h2>${t('constellations')}${con!==null?` (${t('you_have',{n:con})})`:''}</h2><div class="card">${i.constellations.map((k,n)=>{
    const open = con!==null && n<con;
    return `<div style="${n?'margin-top:10px;':''}font-size:13px;line-height:1.45"><b>C${n+1}. ${esc(k.name)}</b> ${con!==null?`<span class="badge ${open?'ok':'low'}">${open?t('opened'):t('closed')}</span>`:''}<div style="color:#D9D3C3;margin-top:2px">${esc(k.simple||k.text)}</div></div>`; }).join('')}
    <div class="note" style="margin-top:10px">${t('const_note')}</div></div>`;
}

function render(){
  document.documentElement.lang = S.lang;
  const app = document.getElementById('app');
  let h='';
  if(S.tab==='mine') h=viewMine();
  else if(S.tab==='ref') h=viewRef();
  else if(S.tab==='team') h=viewTeam();
  else h=viewPatch();
  h += `<nav>${[['mine','nav_mine'],['ref','nav_ref'],['team','nav_team'],['patch','nav_patch']].map(([k,tk])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${t(tk)}</button>`).join('')}</nav>`;
  if(S.add) h += viewAdd();
  if(S.detail) h += viewDetail();
  if(S.pick!==null) h += viewPick();
  app.innerHTML = h;
}

function tile(c, action, extra=''){
  return `<button class="tile ${extra}" data-a="${action}" data-v="${esc(c.key)}">${emblem(c)}<b>${esc(nm(c))}</b><small>${esc(sub(c))}${S.levels[c.key]&&S.owned[c.key]?' · '+t('lvl')+' '+S.levels[c.key]:''}</small>${S.owned[c.key]&&action==='open'&&S.tab==='ref'?`<small style="color:#5ED6B1">${t('own_badge')}</small>`:''}</button>`;
}

function knowledgeFor(name){ return DATA.knowledge.filter(e=>e.character===name); }
function confBadge(c){ return c==='Высокая'?'ok':c==='Спорно'?'mid':'low'; }
function knowBlock(m){
  const ks = knowledgeFor(m.nameRu);
  if(!ks.length) return `<p class="note" style="margin:8px 0 0">${t('no_know')}</p>`;
  return ks.map(e=>`<div style="margin-top:8px"><b style="font-size:14px">${t('role')}: ${esc(S.lang==='en'?(ROLE[e.role]||e.role):e.role)}</b>${e.recommendations.map(r=>`<div style="margin-top:6px;font-size:13px;line-height:1.4"><span class="badge ${confBadge(r.confidence)}">${esc(S.lang==='en'?(CONF[r.confidence]||r.confidence):r.confidence)}</span> ${esc(r.pieces)} ${t('pcs')}: ${esc(S.lang==='en'&&r.setEn?r.setEn:r.set)} <span class="note">${t('of_src',{a:r.consensus.agree,t:r.consensus.total})}</span><div class="note">${r.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}</div></div>`).join('')}</div>`).join('')+`<div class="note" style="margin-top:8px">${t('sets_hint')}</div>`;
}

function aboutBlock(c){
  const i = infoOf(c);
  if(!i) return `<p class="note" style="margin:0">${t('no_desc')}</p>`;
  const row = (lbl,x)=> x&&x.name ? `<div style="margin-top:10px;font-size:13px;line-height:1.45"><b>${lbl}: ${esc(x.name)}.</b> ${esc(x.gist||'')}</div>` : '';
  const pas = (i.passives||[]).map(p=>`<div style="margin-top:6px"><b>${esc(p.name)}.</b> ${esc(p.gist||'')}</div>`).join('');
  return `${i.title?`<div style="font-size:13px;color:#E6C77A;margin-bottom:6px">${esc(i.title)}</div>`:''}
    ${i.bio?`<div style="font-size:14px;line-height:1.5">${esc(i.bio)}</div>`:''}
    ${row(t('skill_e'),i.skill)}${row(t('burst_q'),i.burst)}
    ${pas?`<div style="margin-top:10px;font-size:13px;line-height:1.45"><b>${t('passives')}</b>${pas}</div>`:''}
    <div class="note" style="margin-top:10px">${t('about_note')}</div>`;
}

function loreBlock(c){
  const l = (DATA.lore||{})[c.id] && !c.isTraveler ? DATA.lore[c.id] : null;
  const text = l ? (S.lang==='en' ? (l.textEn||null) : l.text) : null;
  if(!text) return `<p class="note" style="margin:0">${t('lore_pending')}</p><div class="note" style="margin-top:8px;line-height:1.9">${wikiLinks(c)}</div>`;
  const link = `<a href="${esc(l.source.url)}" target="_blank" rel="noopener">Genshin Impact Wiki</a>`;
  return `<div style="font-size:14px;line-height:1.55">${esc(text)}</div>
    <div class="note" style="margin-top:8px">${l.status&&l.status.indexOf('ИИ')>=0?t('lore_ai'):t('lore_own')}${t('lore_tail',{link})}</div>`;
}

function wikiLinks(c){
  const slug = encodeURIComponent((c.isTraveler?'Traveler':c.nameEn).replace(/ /g,'_'));
  const base = 'https://genshin-impact.fandom.com/wiki/'+slug;
  if(c.isTraveler) return `<a href="${base}" target="_blank" rel="noopener">${t('wiki_page')}</a>`;
  return `<a href="${base}/Profile" target="_blank" rel="noopener">${t('wiki_lore')}</a><br><a href="${base}/Voice-Overs" target="_blank" rel="noopener">${t('wiki_quotes')}</a>`;
}

    <div class="card">${knowBlock(c)}</div>
    <h2>${t('fit')}</h2>

function viewAdd(){

function viewTeam(){
  const members = S.team.map(k=>k?byKey[k]:null);
  const filled = members.filter(Boolean);
  const covered = filled.filter(m=>knowledgeFor(m.nameRu).length).length;
  const slots = members.map((m,i)=>`<button class="slot" data-a="pick" data-v="${i}" aria-label="${esc(t('slot',{n:i+1}))}">${m?emblem(m,'s f'):'<div class="em s">+</div>'}<span>${m?esc(nm(m)):t('empty')}</span></button>`).join('');
  const cards = filled.map(m=>`<div class="card"><div class="row">${emblem(m,'s')}<div><b>${esc(nm(m))}</b><div class="note">${esc(sub(m))}</div></div></div>${knowBlock(m)}</div>`).join('');
  const cov = filled.length ? Math.round(covered/filled.length*100) : 0;
  const nxv = DATA.meta.versions[0].version;
  return `${langBar()}
  <h1>${t('team_title')}</h1>
  <p class="sub">${t('team_sub',{d:DATA.meta.asOf,v:DATA.meta.currentVersion.version,nx:nxv})}</p>
  <h2>${t('compo')}</h2>
  <div class="slots">${slots}</div>
  <h2>${t('meta_fit')}</h2>

    <div class="bar" style="margin:10px 0" role="img" aria-label="${esc(t('cov_aria',{a:cov}))}"><i style="width:${cov}%"></i></div>
    <div class="note">${t('cov_note',{a:covered,b:filled.length})}</div>

  <h2>${t('roles_sets')}</h2>

}

function viewPick(){
  const list = DATA.characters.filter(c=>S.owned[c.key]);
  return `<div class="over"><div>
    <h1>${t('pick_title')}</h1>
    <p class="sub">${list.length?t('pick_sub'):t('pick_none')}</p>
    <div class="grid" style="margin-top:14px">${list.map(c=>tile(c,'set')).join('')}</div>
    <div class="row" style="margin-top:16px"><button class="btn2" data-a="clear">${t('clear_slot')}</button><button class="btn2" data-a="close">${t('close')}</button></div>
  </div></div>`;
}

function viewPatch(){
  const stBadge = s => s==='Подтверждено'?'ok':s==='Анонс'?'mid':s==='Слух'?'pur':'low';
  const stName = s => (STATUS[s]||{})[S.lang]||s;
  const m = DATA.meta;
  const note = o => (S.lang==='en'&&o.noteEn)?o.noteEn:o.note;
  return `${langBar()}
  <h1>${t('patch_title')}</h1>
  <p class="sub">${t('patch_sub',{d:esc(m.asOf)})}</p>
  <h2>${t('now')}</h2>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${t('version',{v:esc(m.currentVersion.version)})}</b><span class="badge ${stBadge(m.currentVersion.status)}">${esc(stName(m.currentVersion.status))}</span></div><div class="note" style="margin-top:6px">${esc(note(m.currentVersion))}</div></div>
  ${m.versions.map(v=>`
  <h2>${t('version',{v:esc(v.version)})}${v.name?' «'+esc(v.name)+'»':''}</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>${t('release')}: ${esc(fmtDate(v.release))}</b><span class="badge ${stBadge(v.status)}">${esc(stName(v.status))}</span></div>
    ${v.source?`<div class="note" style="margin-top:6px"><a href="${esc(v.source.url)}" target="_blank" rel="noopener">${esc(v.source.title)}</a></div>`:''}
    ${note(v)?`<div class="note" style="margin-top:6px">${esc(note(v))}</div>`:''}
    ${(v.phases||[]).map(p=>`<div style="margin-top:10px;font-size:13px;line-height:1.4"><b>${t('phase')} ${p.phase}:</b> ${esc(fmtDate(p.start))} – ${esc(fmtDate(p.end))} <span class="badge ${stBadge(p.status)}">${esc(stName(p.status))}</span><div>${p.characterBanners.map(b=>esc(nameByRu(b.character))+' ('+esc(S.lang==='en'?(BTYPE[b.type]||b.type):b.type)+')').join(', ')}</div>${note(p)?`<div class="note">${esc(note(p))}</div>`:''}${p.source?`<div class="note"><a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.title)}</a></div>`:''}</div>`).join('')}
    ${(v.rumoredCharacters||[]).length?`<div style="margin-top:10px;font-size:13px"><b>${t('possible')}:</b> ${v.rumoredCharacters.map(c=>esc(S.lang==='en'&&c.nameEn?c.nameEn:c.name)).join(', ')} <span class="badge pur">${esc(stName('Слух'))}</span></div>`:''}
  </div>`).join('')}`;
}

// Сначала пробуем посредника на своём сайте (/api/uid/...), если его нет, обращаемся к Enka напрямую
async function fetchShowcase(uid){
  try{
    const r = await fetch('/api/uid/'+uid);
    const ct = r.headers.get('content-type')||'';
    if(ct.indexOf('json')>=0) return r;
  }catch(e){}
  return fetch('https://enka.network/api/uid/'+uid);
}

async function loadUid(){
  const uid = S.uid.trim();
  if(!/^\d{9,10}$/.test(uid)){ S.msg=()=>t('enter_uid'); render(); return; }
  S.busy=true; S.msg=()=>t('loading'); render();
  try{
    const r = await fetchShowcase(uid);
    if(!r.ok){
      const known = {400:'e400',404:'e404',424:'e424',429:'e429',500:'e500',503:'e503'}[r.status];
      throw Object.assign(new Error(known||'eN'), {code:r.status, known});
    }
    const d = await r.json();
    const list = d.avatarInfoList || (d.playerInfo&&d.playerInfo.showAvatarInfoList) || [];
    if(!list.length){ S.msg=()=>t('empty_showcase'); }
    else{
      let n=0, trav=0;
      list.forEach(a=>{
        const c = DATA.characters.find(x=>x.id===a.avatarId && !x.isTraveler);
        if(c){ S.owned[c.key]=true; const lv=(a.propMap&&a.propMap['4001']&&a.propMap['4001'].val)||a.level; if(lv) S.levels[c.key]=lv; try{ S.builds[c.key]=parseBuild(a); }catch(e){} n++; }
        else if(a.avatarId===10000005||a.avatarId===10000007) trav++;
      });
      S.msg = ()=> t('loaded',{n})+(trav?t('trav'):'')+t('rest');
    }
    save();
  }catch(e){
    if(e instanceof TypeError) S.msg=()=>t('net_err');
    else S.msg=()=>t(e.known||'eN',{c:e.code});
  }
  S.busy=false; render();
}

function rerender(keepPage){
  const ovs=document.querySelectorAll('.over'); const ost=ovs.length?ovs[ovs.length-1].scrollTop:0;
  const sc=window.scrollY; render();
  const o2=document.querySelectorAll('.over'); if(o2.length) o2[o2.length-1].scrollTop=ost;
  if(keepPage) window.scrollTo(0,sc);
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='tab'){ S.tab=v; S.detail=null; S.add=null; S.pick=null; render(); window.scrollTo(0,0); return; }
  else if(a==='lang'){ S.lang=v; sortChars(); save(); }
  else if(a==='fMine'){ S.fMine=v; }
  else if(a==='fRef'){ S.fRef=v; }
  else if(a==='open'){ S.detail=v; }
  else if(a==='closeDetail'){ S.detail=null; }
  else if(a==='toggleOwn'){ S.owned[v]=!S.owned[v]; if(!S.owned[v]){ S.team=S.team.map(k=>k===v?null:k); delete S.levels[v]; delete S.builds[v]; } save(); }
  else if(a==='addOpen'){ S.add={q:'',f:'all'}; }
  else if(a==='aF'){ S.add.f=v; }
  else if(a==='addPick'){ S.owned[v]=true; save(); }
  else if(a==='addClose'){ S.add=null; }
  else if(a==='load'){ loadUid(); return; }
  else if(a==='pick'){ S.pick=Number(v); }
  else if(a==='set'){ S.team[S.pick]=v; S.pick=null; save(); }
  else if(a==='clear'){ S.team[S.pick]=null; S.pick=null; save(); }
  else if(a==='close'){ S.pick=null; }
  rerender(true);
});
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(id==='uid'){ S.uid=e.target.value; save(); return; }
  if(id==='q'||id==='aq'){
    if(id==='q') S.q=e.target.value; else S.add.q=e.target.value;
    const p=e.target.selectionStart; rerender(true);
    const el=document.getElementById(id); if(el){ el.focus(); el.setSelectionRange(p,p); }
  }
});
load(); sortChars(); render();
try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
</script>
